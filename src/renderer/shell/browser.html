<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>浏览器</title>
    <link rel="stylesheet" href="browser.css" />
  </head>
  <body>
    <div id="tabbar">
      <div class="tabbar-left">
        <div id="tabs"></div>
        <button id="btn-new-tab" class="new-tab-btn" title="新建标签页">+</button>
      </div>
      <div class="tabbar-right">
        <button id="btn-min" class="tb-btn" title="最小化">—</button>
        <button id="btn-max" class="tb-btn" title="最大化">▢</button>
        <button id="btn-close" class="tb-btn" title="关闭浏览器窗口">✕</button>
      </div>
    </div>
    <script src="browser.js"></script>
  </body>
</html>
