<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>翻译</title>
    <link rel="stylesheet" href="tokens.css" />
    <link rel="stylesheet" href="titlebar.css" />
    <link rel="stylesheet" href="translate.css" />
  </head>
  <body>
    <div id="titlebar">
      <div class="tb-left">
        <span class="tb-logo">DeepSeek 翻译</span>
      </div>
      <div class="tb-right">
        <button id="btn-settings" class="tb-btn" title="设置" aria-label="设置"><svg class="tb-ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></button>
        <button id="btn-pin" class="tb-btn tb-btn-pin" title="置顶" aria-label="置顶"><svg class="tb-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M16 9V4h1c.55 0 1-.45 1-1s-.45-1-1-1H7c-.55 0-1 .45-1 1s.45 1 1 1h1v5c0 1.66-1.34 3-3 3v2h5.97v7l1 1 1-1v-7H19v-2c-1.66 0-3-1.34-3-3z"/></svg></button>
        <button id="btn-swap" class="tb-btn" title="主副窗口切换"><svg class="tb-ico" viewBox="0 0 1024 1024" aria-hidden="true" style="fill:currentColor;stroke:none;"><path d="M921.6 12.8h-307.2A89.6 89.6 0 0 0 524.8 102.4v307.2c0 49.4592 40.1408 89.6 89.6 89.6h307.2A89.6 89.6 0 0 0 1011.2 409.6V102.4A89.6 89.6 0 0 0 921.6 12.8zM204.8 140.8h204.8a38.4 38.4 0 0 0 0-76.8H204.8A140.8 140.8 0 0 0 64 204.8v614.4A140.8 140.8 0 0 0 204.8 960h614.4A140.8 140.8 0 0 0 960 819.2v-204.8a38.4 38.4 0 0 0-76.8 0v204.8c0 35.328-28.672 64-64 64H204.8c-35.328 0-64-28.672-64-64V204.8c0-35.328 28.672-64 64-64z" fill="currentColor"/><path d="M601.6 115.2a12.8 12.8 0 0 1 12.8-12.8h281.6a12.8 12.8 0 0 1 12.8 12.8v281.6a12.8 12.8 0 0 1-12.8 12.8H614.4a12.8 12.8 0 0 1-12.8-12.8z" fill="currentColor"/></svg></button>
        <button id="btn-min" class="tb-btn" title="最小化">—</button>
        <button id="btn-max" class="tb-btn" title="最大化">▢</button>
        <button id="btn-close" class="tb-btn" title="关闭">✕</button>
      </div>
    </div>

    <div class="translate-body">
      <div class="lang-row">
        <select id="src-lang" class="lang-select"></select>
        <span class="swap">→</span>
        <select id="dst-lang" class="lang-select"></select>
      </div>
      <div class="editor-row">
        <textarea id="src-text" class="editor" placeholder="输入或粘贴要翻译的内容…"></textarea>
        <textarea id="dst-text" class="editor" placeholder="译文（实时回填）" readonly></textarea>
      </div>
      <div class="action-row">
        <label class="sync-toggle">
          <input type="checkbox" id="sync-toggle" checked /> 实时同步到对话
        </label>
        <button id="btn-send" class="send-btn">发送结果到对话</button>
      </div>
    </div>

    <script src="translate.js"></script>
  </body>
</html>
