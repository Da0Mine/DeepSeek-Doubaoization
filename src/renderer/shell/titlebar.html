<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DeepSeek</title>
    <link rel="stylesheet" href="tokens.css" />
    <link rel="stylesheet" href="titlebar.css" />
  </head>
  <body>
    <div id="titlebar">
      <div class="tb-left">
        <span class="tb-logo">DeepSeek</span>
        <div class="tb-nav">
          <button id="btn-nav-back" class="tb-btn tb-nav-btn" title="后退"><svg class="tb-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg></button>
          <button id="btn-nav-forward" class="tb-btn tb-nav-btn" title="前进"><svg class="tb-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18l6-6-6-6"/></svg></button>
          <button id="btn-nav-reload" class="tb-btn tb-nav-btn" title="刷新"><svg class="tb-ico tb-refresh" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.34 5.66"/><path d="M20 4v7h-7"/></svg></button>
        </div>
      </div>
      <div class="tb-right">
        <button id="btn-update" class="tb-btn tb-btn-update" title="发现新版本" style="display:none;"><svg class="tb-ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10"/><polyline points="16 12 12 8 8 12"/><line x1="12" y1="16" x2="12" y2="8"/></svg><span class="tb-update-dot"></span></button>
        <button id="btn-settings" class="tb-btn" title="设置"><svg class="tb-ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></button>
        <div id="tb-pinned"></div>
        <button id="btn-pin" class="tb-btn tb-btn-pin" title="置顶" aria-label="置顶"><svg class="tb-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M16 9V4h1c.55 0 1-.45 1-1s-.45-1-1-1H7c-.55 0-1 .45-1 1s.45 1 1 1h1v5c0 1.66-1.34 3-3 3v2h5.97v7l1 1 1-1v-7H19v-2c-1.66 0-3-1.34-3-3z"/></svg></button>
        <button id="btn-swap" class="tb-btn" title="主副窗口切换"><svg class="tb-ico" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7h12"/><path d="M11 4l4 3-4 3"/><path d="M21 17H9"/><path d="M13 14l-4 3 4 3"/></svg></button>
        <button id="btn-min" class="tb-btn" title="最小化"><svg class="tb-ico tb-wc" viewBox="0 0 24 24" aria-hidden="true"><line x1="5" y1="12" x2="19" y2="12"/></svg></button>
        <button id="btn-max" class="tb-btn" title="最大化"><svg class="tb-ico tb-wc" viewBox="0 0 24 24" aria-hidden="true"><rect x="4.5" y="4.5" width="15" height="15" rx="2"/></svg></button>
        <button id="btn-close" class="tb-btn" title="关闭"><svg class="tb-ico tb-wc" viewBox="0 0 24 24" aria-hidden="true"><line x1="6" y1="6" x2="18" y2="18"/><line x1="18" y1="6" x2="6" y2="18"/></svg></button>
      </div>
    </div>
    <script src="titlebar.js"></script>
  </body>
</html>
