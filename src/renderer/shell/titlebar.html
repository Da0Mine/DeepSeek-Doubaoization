<!DOCTYPE html>
<html lang="zh-CN">
  <head>

    <link rel="stylesheet" href="tokens.css" />

    <div id="titlebar">

        <button id="btn-pin" class="tb-btn tb-btn-pin" title="置顶" aria-label="置顶"><svg class="tb-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M16 9V4h1c.55 0 1-.45 1-1s-.45-1-1-1H7c-.55 0-1 .45-1 1s.45 1 1 1h1v5c0 1.66-1.34 3-3 3v2h5.97v7l1 1 1-1v-7H19v-2c-1.66 0-3-1.34-3-3z"/></svg></button>

        <button id="btn-max" class="tb-btn" title="最大化"><svg class="tb-ico tb-wc" viewBox="0 0 24 24" aria-hidden="true"><rect x="4.5" y="4.5" width="15" height="15" rx="2"/></svg></button>
        <button id="btn-close" class="tb-btn" title="关闭"><svg class="tb-ico tb-wc" viewBox="0 0 24 24" aria-hidden="true"><line x1="6" y1="6" x2="18" y2="18"/><line x1="18" y1="6" x2="6" y2="18"/></svg></button>
      </div>
    </div>
    <script src="titlebar.js"></script>

</html>
