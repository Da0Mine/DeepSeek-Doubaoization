<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      background: transparent;
      overflow: hidden;
    }
    .taskbar-btn {
      position: fixed;
      bottom: 8px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(74, 144, 226, 0.7);
      color: white;
      padding: 8px 20px;
      border-radius: 20px;
      font-size: 14px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      box-shadow: 0 2px 12px rgba(74, 144, 226, 0.4);
      cursor: pointer;
      user-select: none;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: background 0.2s;
      white-space: nowrap;
    }
    .taskbar-btn:hover {
      background: rgba(53, 122, 189, 0.9);
    }
    /* 非识图模式（快速模式）提示置黄：背景、阴影、悬浮色同步切换 */
    .taskbar-btn.warning {
      background: rgba(226, 160, 74, 0.75);
      box-shadow: 0 2px 12px rgba(226, 160, 74, 0.45);
    }
    .taskbar-btn.warning:hover {
      background: rgba(190, 128, 44, 0.92);
    }
    .taskbar-btn svg {
      width: 14px;
      height: 14px;
      flex-shrink: 0;
    }
    .taskbar-btn .hover-text {
      display: none;
    }
    .taskbar-btn:hover .normal-text {
      display: none;
    }
    .taskbar-btn:hover .hover-text {
      display: inline;
    }
  </style>
</head>
<body>
  <div class="taskbar-btn" id="stopBtn">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="2" y="3" width="20" height="14" rx="2" ry="2"/>
      <line x1="8" y1="21" x2="16" y2="21"/>
      <line x1="12" y1="17" x2="12" y2="21"/>
    </svg>
    <span class="normal-text">正在共享屏幕</span>
    <span class="hover-text">取消共享</span>
  </div>

  <script>
    // 主进程经 URL query 传入进入共享时的模型模式：
    // 非识图模式（快速模式）时按钮置黄，正常态文字提示「当前非识图模式」，悬浮仍显示「取消共享」。
    (function () {
      var mode = '';
      try {
        mode = new URLSearchParams(window.location.search).get('mode') || '';
      } catch (e) {}
      var btn = document.getElementById('stopBtn');
      if (mode && mode !== 'vision') {
        btn.classList.add('warning');
        var normal = btn.querySelector('.normal-text');
        if (normal) normal.textContent = '当前非识图模式';
      }
      btn.addEventListener('click', function (e) {
        e.preventDefault();
        e.stopPropagation();
        if (window.__dsScreenShare && window.__dsScreenShare.sendStop) {
          window.__dsScreenShare.sendStop();
        }
      });
    })();
  </script>
</body>
</html>
