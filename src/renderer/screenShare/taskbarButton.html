<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="../shell/tokens.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      background: transparent;
      overflow: hidden;
    }
    .taskbar-btn {
      position: fixed;
      bottom: 8px;
      left: 50%;
      transform: translateX(-50%);
      /* 与共享文档悬浮窗一致的透明毛玻璃样式，保留蓝色主色 */
      background: rgba(74, 144, 226, 0.32);
      backdrop-filter: blur(20px) saturate(1.6);
      -webkit-backdrop-filter: blur(20px) saturate(1.6);
      color: white;
      padding: 8px 20px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.20);
      font-size: var(--text-body, 14px);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
      box-shadow: 0 8px 28px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.12);
      cursor: pointer;
      user-select: none;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: background 0.2s;
      white-space: nowrap;
    }
    .taskbar-btn:hover {
      /* 悬浮=即将取消共享：变淡红色作色彩提醒 */
      background: rgba(226, 74, 74, 0.55);
      border-color: rgba(255, 120, 120, 0.35);
    }
    /* 非识图模式（快速模式）提示置黄：背景、阴影、悬浮色同步切换 */
    .taskbar-btn.warning {
      background: rgba(226, 160, 74, 0.32);
      border-color: rgba(255, 255, 255, 0.20);
    }
    .taskbar-btn.warning:hover {
      background: rgba(226, 160, 74, 0.48);
    }
    .taskbar-btn svg {
      width: 14px;
      height: 14px;
      flex-shrink: 0;
    }
    .taskbar-btn .hover-text {
      display: none;
    }
    .taskbar-btn:hover .normal-text {
      display: none;
    }
    .taskbar-btn:hover .hover-text {
      display: inline;
    }
  </style>
</head>
<body>
  <div class="taskbar-btn" id="stopBtn">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="2" y="3" width="20" height="14" rx="2" ry="2"/>
      <line x1="8" y1="21" x2="16" y2="21"/>
      <line x1="12" y1="17" x2="12" y2="21"/>
    </svg>
    <span class="normal-text">正在共享屏幕</span>
    <span class="hover-text">取消共享</span>
  </div>

  <script>
    // 主进程经 URL query 传入进入共享时的模型模式：
    // 识图模式（vision）：正常态「正在共享屏幕」，悬浮「取消共享」，点击退出共享。
    // 非识图模式（快速/专家）：正常态置黄提示「当前非识图模式」，悬浮「立即切换」，
    //   点击后切换识图模式（当前窗口新开对话并切换），共享继续开启。
    (function () {
      var mode = '';
      try {
        mode = new URLSearchParams(window.location.search).get('mode') || '';
      } catch (e) {}
      var btn = document.getElementById('stopBtn');
      var isVision = !mode || mode === 'vision';
      if (!isVision) {
        btn.classList.add('warning');
        var normal = btn.querySelector('.normal-text');
        var hover = btn.querySelector('.hover-text');
        if (normal) normal.textContent = '当前非识图模式';
        if (hover) hover.textContent = '立即切换';
      }
      btn.addEventListener('click', function (e) {
        e.preventDefault();
        e.stopPropagation();
        if (!window.__dsScreenShare) return;
        // 非识图模式：点击=切换识图模式；识图模式：点击=退出共享
        if (isVision) {
          window.__dsScreenShare.sendStop();
        } else {
          window.__dsScreenShare.sendSwitchVision();
        }
      });
      // 悬浮进入/移出：把屏幕四角共享框同步为淡红（进入=提示将取消共享；移出恢复蓝色）
      btn.addEventListener('mouseenter', function () {
        if (window.__dsScreenShare) window.__dsScreenShare.sendHover(true);
      });
      btn.addEventListener('mouseleave', function () {
        if (window.__dsScreenShare) window.__dsScreenShare.sendHover(false);
      });
    })();
  </script>
</body>
</html>
