# electron-builder 配置（单一来源，替代 package.json 中的 build 字段）
# appId 决定安装器的「身份」，即新版能否覆盖识别旧版（v1.0.0~v1.4.1 均为 com.deepseek.desktop）。
# 注意：任务栏图标冲突与 appId 无关，而是由运行时 app.setAppUserModelId 决定（见 main.ts），保持独立值即可。
appId: com.deepseek.desktop
productName: DeepSeek
copyright: Copyright © 2026 Kou
directories:
  output: release
  buildResources: src/renderer/assets/icons
files:
  - dist/**/*
  - package.json
# 注意：运行时零依赖，仅打包编译产物 dist/。图标为可选，缺失时使用默认图标。
# 离线打包：直接用本机 npm 安装的 Electron 二进制（node_modules/electron/dist），避免联网下载 Electron zip。
electronDist: node_modules/electron/dist
# 原生模块解包：selection-hook 的原生 .node 放在 prebuilds/win32-x64/，electron-builder 的
# 自动智能解包不一定识别，必须显式解包，否则 .node 留在 asar 内无法加载会使主进程启动崩溃。
asarUnpack:
  - node_modules/**/*.node
  # koffi 是 WASM 实现的 FFI（调 user32 SendInput 模拟 Ctrl+C 给 WPS 划词取词）。
  # WASM 文件与源文件较大且需按路径读取，整体解包以确保打包后 FFI 调用可用。
  - node_modules/koffi/**/*
# 只保留中文/英文两套 Electron 语言包：Electron 默认打包全部 ~50 个 locale（约 46MB），
# 本应用界面为中文（英文兜底），其余语言包无用途。裁掉后安装包更小、安装解压写盘更快。
electronLanguages:
  - zh-CN
  - en-US
win:
  target: nsis
  # 应用/exe/桌面快捷方式图标（打包期读取、自动转 .ico 嵌入 exe）。
  # 此路径相对 buildResources（src/renderer/assets/icons）。
  # 白 logo + 蓝底(#5D72F5)圆角矩形，≥256×256 PNG；与托盘 favicon.ico 分离(托盘运行时不改)。
  icon: deepseek-app-256.png
  artifactName: DeepSeek-Setup-${version}.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  # 自定义安装脚本：安装/卸载前静默 taskkill /F 关闭正在运行的程序（不弹框、不需人工确认）。
  include: build/installer.nsh
mac:
  target: dmg
  category: public.app-category.productivity
linux:
  target: AppImage
  category: Utility
  # Linux 托盘依赖 libappindicator；具体说明见 README
