# electron-builder 配置（单一来源，替代 package.json 中的 build 字段）
appId: com.deepseek.desktop.desktop
productName: DeepSeek
copyright: Copyright © 2026 Kou
directories:
  output: release
  buildResources: src/renderer/assets/icons
files:
  - dist/**/*
  - package.json
# 捆绑精简版 Python（带 pip + 预装 openpyxl/python-docx），随安装包分发给任意电脑，
# 让 python_exec / python_pip_install 开箱即用、零配置（LocalShellServer 优先使用它）。
extraResources:
  - from: resources/python
    to: python
    filter:
      - "**/*"
# 注意：运行时零依赖，仅打包编译产物 dist/。图标为可选，缺失时使用默认图标。
win:
  target: nsis
  # 应用/exe/桌面快捷方式图标（打包期读取、自动转 .ico 嵌入 exe）。
  # 此路径相对 buildResources（src/renderer/assets/icons）。
  # 白 logo + 蓝底(#5D72F5)圆角矩形，≥256×256 PNG；与托盘 favicon.ico 分离(托盘运行时不改)。
  icon: deepseek-app-256.png
  artifactName: DeepSeek-Setup-${version}.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
mac:
  target: dmg
  category: public.app-category.productivity
linux:
  target: AppImage
  category: Utility
  # Linux 托盘依赖 libappindicator；具体说明见 README
